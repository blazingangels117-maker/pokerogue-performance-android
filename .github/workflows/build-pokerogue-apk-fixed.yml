name: Build PokéRogue Performance APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/net/pokerogue/performance

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PokeroguePerformance"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'net.pokerogue.performance'
              compileSdk 35

              defaultConfig {
                  applicationId 'net.pokerogue.performance'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0-performance'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:label="PokéRogue Performance"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/net/pokerogue/performance/MainActivity.java <<'EOF'
          package net.pokerogue.performance;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebViewRenderProcess;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String HOME = "https://pokerogue.net/";
              private FrameLayout root;
              private WebView web;
              private String lastUrl = HOME;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  immersive();
                  WebView.setWebContentsDebuggingEnabled(false);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  setContentView(root);
                  createWebView();
                  addResetButton();
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private void createWebView() {
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  web.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_BOUND, true);

                  root.addView(web, 0, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportMultipleWindows(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setTextZoom(100);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setSafeBrowsingEnabled(true);
                  s.setOffscreenPreRaster(false);

                  // Present as normal Android Chrome rather than a generic embedded WebView.
                  // This improves compatibility with Discord's web login UI while keeping
                  // authentication on the official PokéRogue/Discord pages.
                  s.setUserAgentString(
                      "Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 " +
                      "(KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36"
                  );

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("https".equalsIgnoreCase(scheme)) {
                              lastUrl = uri.toString();
                              return false;
                          }
                          if ("http".equalsIgnoreCase(scheme)) {
                              return true;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {
                              Toast.makeText(MainActivity.this, "No app can open this link.", Toast.LENGTH_SHORT).show();
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (url != null) lastUrl = url;
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              Toast.makeText(MainActivity.this, "Connection problem — check internet and retry.", Toast.LENGTH_LONG).show();
                          }
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          if (view == web) {
                              destroyWebView(false);
                              createWebView();
                              Toast.makeText(MainActivity.this, "Renderer recovered.", Toast.LENGTH_SHORT).show();
                          }
                          return true;
                      }
                  });

                  web.loadUrl(lastUrl == null ? HOME : lastUrl);
              }

              private void addResetButton() {
                  TextView reset = new TextView(this);
                  reset.setText("↻");
                  reset.setTextSize(23);
                  reset.setTextColor(Color.WHITE);
                  reset.setGravity(Gravity.CENTER);
                  reset.setAlpha(0.60f);
                  reset.setBackgroundColor(0x66000000);
                  reset.setContentDescription("Reset renderer");
                  reset.setOnClickListener(v -> resetRenderer());
                  reset.setOnLongClickListener(v -> {
                      Toast.makeText(this,
                          "Resets the WebView/GPU renderer but keeps your PokéRogue login cookies.",
                          Toast.LENGTH_LONG).show();
                      return true;
                  });

                  FrameLayout.LayoutParams p = new FrameLayout.LayoutParams(dp(42), dp(42));
                  p.gravity = Gravity.TOP | Gravity.END;
                  p.topMargin = dp(8);
                  p.rightMargin = dp(8);
                  root.addView(reset, p);
              }

              private void resetRenderer() {
                  if (web != null && web.getUrl() != null) lastUrl = web.getUrl();
                  CookieManager.getInstance().flush();

                  // On modern Android explicitly terminate the Chromium renderer process.
                  // Cookies/storage live outside that renderer, so the login is retained.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && web != null) {
                      try {
                          WebViewRenderProcess process = web.getWebViewRenderProcess();
                          if (process != null) process.terminate();
                      } catch (Exception ignored) {}
                  }

                  destroyWebView(false);
                  createWebView();
                  Toast.makeText(this, "Renderer reset — login kept.", Toast.LENGTH_SHORT).show();
              }

              private void destroyWebView(boolean clearData) {
                  if (web == null) return;
                  try {
                      web.stopLoading();
                      web.onPause();
                      web.setWebViewClient(null);
                      web.loadUrl("about:blank");
                      web.clearHistory();
                      root.removeView(web);
                      web.removeAllViews();
                      web.destroy();
                  } catch (Exception ignored) {}
                  web = null;
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              protected void onPause() {
                  if (web != null) {
                      if (web.getUrl() != null) lastUrl = web.getUrl();
                      web.onPause();
                      web.pauseTimers();
                  }
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web == null) createWebView();
                  web.onResume();
                  web.resumeTimers();
                  immersive();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) immersive();
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  CookieManager.getInstance().flush();
                  destroyWebView(false);
                  super.onDestroy();
              }
          }
          EOF

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pokerogue-Performance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokerogue-Performance-APK
          path: Pokerogue-Performance.apk
          if-no-files-found: error
          retention-days: 30
